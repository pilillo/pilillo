# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics
on:
  # Every 6 hours is plenty for a profile card (and keeps commit noise down)
  schedule: [{cron: "0 */6 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # First attempt. Pulling the prebuilt image from ghcr.io occasionally fails
      # with a network reset, and the action's fallback local build is broken
      # upstream, so we simply try again instead of failing the run.
      - name: Generate metrics
        id: metrics
        continue-on-error: true
        uses: lowlighter/metrics@latest
        with: &metrics_opts
          token: ${{ secrets.METRICS_TOKEN }}
          user: pilillo
          template: classic
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner
          repositories_batch: 100
          config_timezone: Europe/Rome
          config_display: large
          config_octicon: yes
          config_twemoji: yes

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Languages
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_ignored: JavaScript, Jupyter Notebook, CSS, HTML
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage

          # Featured repositories
          plugin_repositories: yes
          plugin_repositories_featured: pilillo/igovium, pilillo/gilberto

          # Stars & topics
          plugin_stars: yes
          plugin_stars_limit: 4
          plugin_topics: yes
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          plugin_topics_limit: 15

          # Achievements
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
          plugin_achievements_secrets: yes

      - name: Wait before retry
        if: steps.metrics.outcome == 'failure'
        run: sleep 60

      - name: Generate metrics (retry)
        if: steps.metrics.outcome == 'failure'
        uses: lowlighter/metrics@latest
        with: *metrics_opts
